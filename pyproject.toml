[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-stats-lite"
version = "0.1.0"
description = "Fast, private repository statistics from local git history"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yusuf Berat Zengin" }
]
requires-python = ">=3.10"
keywords = [
    "git",
    "git-stats",
    "repository-metrics",
    "heatmap",
    "bus-factor",
    "code-churn",
    "privacy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.14", "build>=1.2", "twine>=6"]

[project.urls]
Homepage = "https://github.com/YusufBeratZengin/git-stats-lite"
Repository = "https://github.com/YusufBeratZengin/git-stats-lite"
Issues = "https://github.com/YusufBeratZengin/git-stats-lite/issues"
Changelog = "https://github.com/YusufBeratZengin/git-stats-lite/blob/main/CHANGELOG.md"

[project.scripts]
git-stats = "git_stats_lite.cli:main"
git-stats-lite = "git_stats_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
git_stats_lite = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
